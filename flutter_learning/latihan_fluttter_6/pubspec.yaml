name: myapp
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: "none"

# Version and build number
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons for iOS style
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets (images)
  assets:
    - images/gambar_1.jpg

